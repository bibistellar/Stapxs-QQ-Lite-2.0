# 正式版本构建发布
name: build-app
on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

jobs:
    # ========================= 准备项目 =========================
    init:
        name: 初始化构建
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.step_init.outputs.VERSION }}
        steps:
            # 拉取代码
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive
            # 初始化一些流程需要的环境变量
            - name: Init Env
              id: step_init
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "v${VERSION}" ]; then
                      echo "标签 ${{ github.ref_name }} 与 package.json 版本 v${VERSION} 不一致" >&2
                      exit 1
                  fi
                  echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

    # ========================= 构建 Tauri 版本 =========================

    build-tauri:
        name: 构建 Tauri
        needs: init
        uses: ./.github/workflows/build-tauri.yml
        with:
            version: ${{ needs.init.outputs.version }}
        secrets: inherit

    # ========================= 发布构建结果 =========================
    release:
        name: 发布构建结果
        runs-on: ubuntu-latest
        # 使用内置 GITHUB_TOKEN 创建 Release 时需要写权限
        permissions:
            contents: write
        needs:
            - init
            - build-tauri
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            # 下载构建结果
            - name: Download Artifacts
              id: download-artifact
              uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  pattern: ${{ needs.init.outputs.version }}-*
                  merge-multiple: true
            - name: Artifacts List
              run: find release-assets -maxdepth 1 -type f -print
            - name: 生成自动更新清单
              run: node scripts/generate-updater-json.mjs release-assets "${{ github.repository }}" "${{ needs.init.outputs.version }}" "正式发布版本 v${{ needs.init.outputs.version }}"
            # 发布构建结果
            - name: Publish Release
              uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
              with:
                  files: release-assets/*
                  tag_name: v${{ needs.init.outputs.version }}
                  body: |
                      # Release 自动构建
                      `这是一个自动构建版本，由 GitHub Actions 自动构建并发布。`
                      ## 更新内容
                      正式发布版本 v${{ needs.init.outputs.version }}
                      ## 下载说明
                      - Windows：`.exe`（NSIS 安装包）
                      - Linux：`.AppImage` / `.deb`（x86_64 与 aarch64）
                      - macOS：`_aarch64.dmg`（Apple Silicon）、`_x64.dmg`（Intel）

                      > [!NOTE]
                      > macOS 版本为 ad-hoc 签名、未经 Apple 公证，首次打开会提示「已损坏」或「无法验证开发者」。
                      > 请在终端执行以下命令解除隔离标记后即可正常打开：
                      > ```bash
                      > xattr -dr com.apple.quarantine "/Applications/Stapxs QQ Lite.app"
                      > ```
                      ## 自动构建信息
                      - 构建提交：${{ github.sha }}
                      - 构建引用：${{ github.ref_name }}
                  draft: false
                  prerelease: false
                  # 上游用 PAT（可触发下游工作流）；fork 无此 secret 时回退到内置 GITHUB_TOKEN
                  token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
