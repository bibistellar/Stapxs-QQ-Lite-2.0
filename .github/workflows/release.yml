# 主分支构建发布
name: build-app
on:
    push:
        branches:
            - 2.0

jobs:
    # ========================= 准备项目 =========================
    init:
        name: 初始化构建
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.step_init.outputs.VERSION }}
        steps:
            # 拉取代码
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive
            # 初始化一些流程需要的环境变量
            - name: Init Env
              id: step_init
              run: echo VERSION=$(node -p "require('./package.json').version") >> $GITHUB_OUTPUT

    # ========================= 构建 Tauri 版本 =========================

    build-tauri:
        name: 构建 Tauri
        needs: init
        uses: ./.github/workflows/build-tauri.yml
        with:
            version: ${{ needs.init.outputs.version }}

    # ========================= 发布构建结果 =========================
    release:
        name: 发布构建结果
        runs-on: ubuntu-latest
        # 使用内置 GITHUB_TOKEN 创建 Release 时需要写权限
        permissions:
            contents: write
        needs:
            - init
            - build-tauri
        steps:
            # 下载构建结果
            - name: Download Artifacts
              id: download-artifact
              uses: actions/download-artifact@v4
              with:
                  path: ${{ needs.init.outputs.version }}-*
                  pattern: ${{ needs.init.outputs.version }}-*
                  merge-multiple: true
            - name: Artifacts List
              run: ls -R
            # 发布构建结果
            - name: Publish Release
              uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
              with:
                  files: ./${{ needs.init.outputs.version }}-*/*
                  tag_name: v${{ needs.init.outputs.version }}
                  body: |
                      # Release 自动构建
                      `这是一个自动构建版本，由 GitHub Actions 自动构建并发布。`
                      ## 更新内容
                      ${{ github.event.head_commit.message }}
                      ## 下载说明
                      - Windows：`.exe`（NSIS 安装包）
                      - Linux：`.AppImage` / `.deb`（x86_64 与 aarch64）
                      - macOS：`_aarch64.dmg`（Apple Silicon）、`_x64.dmg`（Intel）

                      > [!NOTE]
                      > macOS 版本为 ad-hoc 签名、未经 Apple 公证，首次打开会提示「已损坏」或「无法验证开发者」。
                      > 请在终端执行以下命令解除隔离标记后即可正常打开：
                      > ```bash
                      > xattr -dr com.apple.quarantine "/Applications/Stapxs QQ Lite.app"
                      > ```
                      ## 自动构建信息
                      - 构建时间：${{ github.event.head_commit.timestamp }}
                      - 构建提交：${{ github.event.head_commit.id }}
                      - 构建分支：${{ github.event.head_commit.tree_id }}
                  draft: false
                  prerelease: false
                  # 上游用 PAT（可触发下游工作流）；fork 无此 secret 时回退到内置 GITHUB_TOKEN
                  token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
