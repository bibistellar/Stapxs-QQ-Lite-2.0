name: 构建 Tauri

on:
    workflow_call:
        inputs:
            version:
                description: "应用版本"
                required: true
                type: string

jobs:
    build:
        runs-on: ${{ matrix.os }}
        env:
            TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        strategy:
            # 单个平台失败不影响其它平台继续构建、发布
            fail-fast: false
            matrix:
                # PS：GitHub 已下线 macos-13（Intel）运行器，继续使用会让 job 永久排队，
                #     进而卡住依赖它的 release；Intel 版改为在 Apple Silicon 上交叉编译
                os: [windows-2022, ubuntu-22.04, ubuntu-22.04-arm, macos-14]

        steps:
            - name: 安装构建依赖
              if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-22.04-arm'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libglib2.0-dev \
                                        libgtk-3-dev \
                                        pkg-config \
                                        xdg-utils \
                                        build-essential \
                                        librsvg2-dev \
                                        libwebkit2gtk-4.0-dev \
                                        libwebkit2gtk-4.1-dev \
                                        libjavascriptcoregtk-4.0-dev \
                                        libayatana-appindicator3-dev
            - name: 拉取代码
              uses: actions/checkout@v4
              with:
                  submodules: recursive
            - name: 启用 Corepack
              run: corepack enable
            - name: 设置 Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: 'yarn'
            # 更新依赖
            - name: 更新依赖
              run: yarn
            - name: 设置 Rust
              uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f
              with:
                  toolchain: stable
                  profile: minimal
                  override: true

            - name: 检查更新签名配置
              run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) throw new Error('请配置 TAURI_SIGNING_PRIVATE_KEY Secret')"

            # Apple Silicon 运行器上同时准备两个目标，用于交叉编译 Intel 版
            - name: 添加 macOS 构建目标
              if: matrix.os == 'macos-14'
              run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

            - name: 检查 Tauri 环境
              run: yarn tauri info

            - name: 构建 Tauri 应用
              if: matrix.os == 'windows-2022'
              run: yarn build:tauri -c src/tauri/tauri.updater.conf.json -t x86_64-pc-windows-msvc -b nsis
            - name: 构建 Tauri 应用
              if: matrix.os == 'ubuntu-22.04'
              run: yarn build:tauri -c src/tauri/tauri.updater.conf.json -t x86_64-unknown-linux-gnu -b appimage,deb
            - name: 构建 Tauri 应用
              if: matrix.os == 'ubuntu-22.04-arm'
              run: yarn build:tauri -c src/tauri/tauri.updater.conf.json -t aarch64-unknown-linux-gnu -b appimage,deb
            # macOS 使用 tauri.conf.json 中的 ad-hoc 签名（signingIdentity: "-"），
            # 无需 Apple 开发者证书；未签名/未公证，用户首次打开需右键 → 打开
            - name: 构建 Tauri 应用（Apple Silicon）
              if: matrix.os == 'macos-14'
              run: yarn build:tauri -c src/tauri/tauri.updater.conf.json -t aarch64-apple-darwin -b app,dmg
            - name: 构建 Tauri 应用（Intel，交叉编译）
              if: matrix.os == 'macos-14'
              run: yarn build:tauri -c src/tauri/tauri.updater.conf.json -t x86_64-apple-darwin -b app,dmg

            - name: 准备产物目录
              if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-22.04-arm'
              run: |
                  mkdir -p upload
                  cp src/tauri/target/*/release/bundle/deb/*.deb upload/ || true
                  cp src/tauri/target/*/release/bundle/appimage/*.AppImage upload/ || true
                  find src/tauri/target -path '*/release/bundle/*' -name '*.sig' -exec cp {} upload/ \;

            - name: 准备产物目录
              if: matrix.os == 'macos-14'
              run: |
                  mkdir -p upload
                  cp src/tauri/target/*/release/bundle/dmg/*.dmg upload/
                  for target in aarch64-apple-darwin x86_64-apple-darwin; do
                      if [ "$target" = "aarch64-apple-darwin" ]; then arch=aarch64; else arch=x64; fi
                      archive=(src/tauri/target/$target/release/bundle/macos/*.app.tar.gz)
                      if [ ! -f "${archive[0]}" ] || [ ! -f "${archive[0]}.sig" ]; then
                          echo "缺少 $target 的 macOS 更新产物或签名" >&2
                          exit 1
                      fi
                      output="upload/Stapxs.QQ.Lite_${{ inputs.version }}_${arch}.app.tar.gz"
                      cp "${archive[0]}" "$output"
                      cp "${archive[0]}.sig" "$output.sig"
                  done

            - name: 准备产物目录
              if: matrix.os == 'windows-2022'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Path upload -Force
                  $files = Get-ChildItem -Path "src/tauri/target/*/release/bundle/nsis/" -Filter *.exe* -Recurse
                  foreach ($file in $files) {
                      Copy-Item -Path $file.FullName -Destination "upload/"
                  }

            - name: 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.version }}-${{ matrix.os }}
                  path: upload/
