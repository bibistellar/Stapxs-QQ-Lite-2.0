name: AI PR Deterministic CI

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      iteration:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the exact PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          branch=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.ref)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          base_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .base.sha)
          test "$branch" = "codex/issue-$ISSUE_NUMBER"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate repository changes
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --check "$BASE_SHA...HEAD"
          changed=$(git diff --name-only "$BASE_SHA...HEAD")
          test -n "$changed"
          if grep -Eq '(^|/)(\.env|\.secrets|secrets\.ya?ml)$|^\.codex/|^\.github/workflows/' <<< "$changed"; then
            echo "AI PR touches a protected path" >&2
            exit 1
          fi
          mapfile -t shell_files < <(find scripts -type f -name '*.sh' -print)
          if ((${#shell_files[@]})); then bash -n "${shell_files[@]}"; fi
          python3 -m py_compile scripts/ai-pr/*.py

      - name: Run repository tests
        run: |
          python3 -m unittest tests/test_ai_pr.py
          yarn typecheck
          yarn test:connection
          yarn test:outgoing

      - name: Dispatch independent Codex review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run codex-review.yml \
            -f pr_number="${{ inputs.pr_number }}" \
            -f issue_number="${{ inputs.issue_number }}" \
            -f iteration="${{ inputs.iteration }}" \
            -f expected_sha="${{ steps.pr.outputs.sha }}"
