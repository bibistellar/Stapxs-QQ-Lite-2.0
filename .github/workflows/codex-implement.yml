name: Codex Issue Implementation

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to continue
        required: true
        type: string
      pr_number:
        description: Existing PR number
        required: false
        default: ''
        type: string
      iteration:
        description: Automated implementation iteration
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: codex-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'ai-fix') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.scope.outputs.issue_number }}
      pr_number: ${{ steps.scope.outputs.pr_number }}
      iteration: ${{ steps.scope.outputs.iteration }}
    steps:
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_ITERATION: ${{ inputs.iteration }}
        run: |
          set -euo pipefail
          issue_number=${EVENT_ISSUE:-$INPUT_ISSUE}
          iteration=${INPUT_ITERATION:-1}
          [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$iteration" =~ ^[1-3]$ ]]
          if [[ -n "$INPUT_PR" ]]; then [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]]; fi
          if [[ "$EVENT_ACTOR" = "github-actions[bot]" ]]; then
            test -n "$INPUT_PR"
            [[ "$iteration" =~ ^[2-3]$ ]]
          else
            test "$EVENT_ACTOR" = "$REPOSITORY_OWNER"
          fi
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "pr_number=$INPUT_PR" >> "$GITHUB_OUTPUT"
          echo "iteration=$iteration" >> "$GITHUB_OUTPUT"

  prepare:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      branch: ${{ steps.scope.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.authorize.outputs.issue_number }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
        run: |
          set -euo pipefail
          branch="codex/issue-$ISSUE_NUMBER"
          if [[ -n "$PR_NUMBER" ]]; then
            branch=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
            test "$branch" = "codex/issue-$ISSUE_NUMBER"
            git fetch origin "$branch"
            git checkout --detach FETCH_HEAD
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          gh issue view "$ISSUE_NUMBER" \
            --json number,title,body,comments,labels,url > "$RUNNER_TEMP/issue.json"
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr view "$PR_NUMBER" \
              --json number,title,body,comments,headRefOid,url > "$RUNNER_TEMP/pr.json"
          else
            printf '{}\n' > "$RUNNER_TEMP/pr.json"
          fi
          scripts/ai-pr/sanitize-worktree.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/source"
          tar -C "$RUNNER_TEMP/source" -czf "$RUNNER_TEMP/source.tgz" .

      - uses: actions/upload-artifact@v4
        with:
          name: codex-input-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source.tgz
            ${{ runner.temp }}/issue.json
            ${{ runner.temp }}/pr.json
          retention-days: 1

  implement:
    needs: [authorize, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codex-input-${{ github.run_id }}
          path: ${{ runner.temp }}/input

      - name: Prepare sanitized workspaces
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work"
          tar -C "$RUNNER_TEMP/work" -xzf "$RUNNER_TEMP/input/source.tgz"

      - name: Install pinned Codex CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap apparmor-profiles apparmor-utils
          profile_source=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile_source"
          sudo install -m 0644 "$profile_source" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
          npm install --global @openai/codex@0.147.0

      - name: Install project dependencies before authentication
        working-directory: ${{ runner.temp }}/work
        run: |
          set -euo pipefail
          corepack enable
          yarn install --immutable

      - name: Snapshot prepared workspace
        run: |
          set -euo pipefail
          printf '%s\n' '**/__pycache__/' '*.py[cod]' > "$RUNNER_TEMP/ai-generated.exclude"
          git --git-dir="$RUNNER_TEMP/work-index" --work-tree="$RUNNER_TEMP/work" init -q
          git --git-dir="$RUNNER_TEMP/work-index" config user.name github-actions[bot]
          git --git-dir="$RUNNER_TEMP/work-index" config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git --git-dir="$RUNNER_TEMP/work-index" config core.excludesFile \
            "$RUNNER_TEMP/ai-generated.exclude"
          git --git-dir="$RUNNER_TEMP/work-index" --work-tree="$RUNNER_TEMP/work" add -A
          git --git-dir="$RUNNER_TEMP/work-index" --work-tree="$RUNNER_TEMP/work" \
            commit -q -m baseline
          cp "$RUNNER_TEMP/input/issue.json" "$RUNNER_TEMP/work/.ai-issue.json"
          cp "$RUNNER_TEMP/input/pr.json" "$RUNNER_TEMP/work/.ai-pr.json"

      - name: Restore ephemeral Codex authentication
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          test -n "$CODEX_AUTH_JSON"
          codex_home="$RUNNER_TEMP/codex-home"
          install -d -m 700 "$codex_home"
          install -m 600 /dev/null "$codex_home/auth.json"
          printf '%s' "$CODEX_AUTH_JSON" > "$codex_home/auth.json"
          echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"

      - name: Implement the issue
        env:
          ITERATION: ${{ needs.authorize.outputs.iteration }}
        run: |
          set -euo pipefail
          codex exec \
            --ephemeral \
            --ignore-user-config \
            --ignore-rules \
            --skip-git-repo-check \
            --sandbox workspace-write \
            --output-last-message "$RUNNER_TEMP/implementation.txt" \
            -C "$RUNNER_TEMP/work" \
            "You are implementing a trusted maintainer-approved GitHub issue. Read AGENTS.md, .ai-issue.json, and .ai-pr.json. This is automated iteration $ITERATION. Project dependencies are already installed; do not install or update them. Make a focused implementation in this sanitized source tree and run safe relevant local tests. Never modify AGENTS.md, .github/workflows, credentials, secret manifests, cluster access, release permissions, or production deployment authorization. Do not use git, GitHub, the network, or files outside this workspace. Do not merely describe changes: edit the files. End with a concise summary and validation performed."
          rm -f "$RUNNER_TEMP/work/.ai-issue.json" "$RUNNER_TEMP/work/.ai-pr.json"
          git --git-dir="$RUNNER_TEMP/work-index" --work-tree="$RUNNER_TEMP/work" add -A
          if git --git-dir="$RUNNER_TEMP/work-index" --work-tree="$RUNNER_TEMP/work" \
            diff --cached --quiet; then
            echo "Codex did not produce any repository changes" >&2
            exit 1
          fi
          git --git-dir="$RUNNER_TEMP/work-index" --work-tree="$RUNNER_TEMP/work" \
            diff --cached --binary --no-ext-diff > "$RUNNER_TEMP/changes.patch"
          "$RUNNER_TEMP/work/scripts/ai-pr/validate-change-scope.py" "$RUNNER_TEMP/changes.patch"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-output-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/changes.patch
            ${{ runner.temp }}/implementation.txt
          retention-days: 1

  publish:
    needs: [authorize, prepare, implement]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          name: codex-output-${{ github.run_id }}
          path: ${{ runner.temp }}/output

      - name: Apply and publish the bounded patch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.authorize.outputs.issue_number }}
          EXISTING_PR: ${{ needs.authorize.outputs.pr_number }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          ITERATION: ${{ needs.authorize.outputs.iteration }}
        run: |
          set -euo pipefail
          scripts/ai-pr/validate-change-scope.py "$RUNNER_TEMP/output/changes.patch"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi
          patch --batch --forward -p1 < "$RUNNER_TEMP/output/changes.patch"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ai: address issue #$ISSUE_NUMBER (iteration $ITERATION)"
          git push origin "HEAD:$BRANCH"
          if [[ -n "$EXISTING_PR" ]]; then
            pr_number=$EXISTING_PR
          else
            pr_url=$(gh pr create --draft --base "$BASE_BRANCH" --head "$BRANCH" \
              --title "AI: $(gh issue view "$ISSUE_NUMBER" --json title --jq .title)" \
              --body "Automated draft for #$ISSUE_NUMBER. Human merge is required during the initial rollout.")
            pr_number=${pr_url##*/}
          fi
          gh issue edit "$ISSUE_NUMBER" --add-label ai-running
          gh workflow run ai-pr-ci.yml \
            -f pr_number="$pr_number" \
            -f issue_number="$ISSUE_NUMBER" \
            -f iteration="$ITERATION"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Publish implementation summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
          ITERATION: ${{ needs.authorize.outputs.iteration }}
        run: |
          set -euo pipefail
          {
            echo "### Codex implementation iteration $ITERATION"
            echo
            sed -n '1,120p' "$RUNNER_TEMP/output/implementation.txt"
            echo
            echo "The deterministic AI PR CI workflow has been dispatched."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
